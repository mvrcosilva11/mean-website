<!DOCTYPE html>
<html lang="pt">

<body>

  <!-- SEPARADOR / PRELOADER (animação MEAN) — só na 1ª abertura do site -->
  <div class="preloader" id="preloader">
    <video class="preloader-video" id="introVideo" autoplay muted playsinline>
      <source src="assets/intro.webm?v=27" type="video/webm" />
      <source src="assets/intro-hevc.mp4?v=27" type="video/mp4; codecs=hvc1" />
    </video>
  </div>
  <script>
    // se já foi visto nesta sessão (ex: voltar à home dentro do site), esconde já
    if (sessionStorage.getItem('mean_intro_seen')) {
      var _p = document.getElementById('preloader');
      if (_p) _p.style.display = 'none';
    }
  </script>

  <!-- NAV -->
  <header class="nav nav-over">
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>

      <div class="nav-dd">
        <a href="work.html">Work</a>
        <div class="nav-dd-menu">
          <a href="projects.html">Projects</a>
        </div>
      </div>
      <a href="index.html" class="nav-logo-link" aria-label="Home"><img class="nav-logo-center" src="assets/logo-branco.png?v=30" alt="MEAN" /></a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- HOME / HERO -->
  <section class="home">
    <video class="home-bg" autoplay muted loop playsinline poster="assets/bg-poster.jpg?v=3">
      <source src="assets/bg.mp4?v=3" type="video/mp4" />
    </video>
    <img class="home-comp" src="assets/corner-homepage-white.png?v=5" alt="MEAN — Creative Agency" />
  </section>

  <script src="main.js?v=30"></script>
</body>
